<!DOCTYPE html>
<html lang="zh-Hant">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Flash Simulation</title>
<script src="https://unpkg.com/@ruffle-rs/ruffle"></script>
<style>html,body,#container{margin:0;width:100%;height:100%;overflow:hidden;background:white}ruffle-player{display:block;width:100%;height:100%}</style></head>
<body><div id="container"></div><script>
const movies = new Map([
 ['anti','antisymmetric wave function.swf'],
 ['wave','Symmetric wave function.swf'],
 ['fluor','螢光.swf'],
 ['phos','磷光.swf']
]);
window.addEventListener('DOMContentLoaded', async () => {
 const key = new URLSearchParams(location.search).get('movie') || 'wave';
 const container = document.getElementById('container');
 try {
  if (!movies.has(key)) throw new Error('Unknown movie: ' + key);
  const player = window.RufflePlayer.newest().createPlayer();
  container.appendChild(player);
  await player.ruffle().load(encodeURIComponent(movies.get(key)));
 } catch (err) { container.textContent = String(err); }
});
</script></body></html>
